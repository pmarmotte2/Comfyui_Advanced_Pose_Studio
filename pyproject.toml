[project]
name = "advanced-pose-studio"
description = "Advanced Pose Studio - interactive MakeHuman character staging, pose editing, OpenPose initialization, and multi-angle pose refinement for ComfyUI."
version = "0.5.0"
license = {file = "LICENSE"}

dependencies = ["aiohttp", "torch", "numpy", "Pillow"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["comfyui", "image-processing", "3d", "pose-estimation"]

[project.urls]
Repository = "https://github.com/pmarmotte2/Comfyui_Advanced_Pose_Studio"
Documentation = "https://github.com/pmarmotte2/Comfyui_Advanced_Pose_Studio"
"Bug Tracker" = "https://github.com/pmarmotte2/Comfyui_Advanced_Pose_Studio/issues"

[tool.comfy]
PublisherId = "advanced-pose-studio"
DisplayName = "Advanced Pose Studio"
NodeIds = [
    "Advanced_Pose_Studio"
]
